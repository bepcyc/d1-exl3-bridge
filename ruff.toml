# Keep source checks independent of configuration outside this checkout.
target-version = "py311"

[lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[lint.per-file-ignores]
# Stdlib unittest discovery supports an uninstalled src-layout checkout.
"tests/test_runtime.py" = ["E402"]
"tests/test_backend.py" = ["E402"]
